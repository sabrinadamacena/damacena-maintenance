<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>loading... damacena.work</title>

  <!-- Automatic redirect after 3 seconds -->
  <meta http-equiv="refresh" content="3;url=https://readymag.website/u542318838/5701574/">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Jost:wght@400&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       BASE
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #191919;
      color: #F2F2F2;
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;

      padding: 32px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      font-family: 'Courier New', monospace;

      font-size: 12px;

      letter-spacing: 0.08em;

      color: #777777;

      text-transform: uppercase;
    }

    .status span {
      color: #E94140;
    }


    /* =========================
       MAIN CONTENT
    ========================= */

    .content {
      width: 100%;
      max-width: 1100px;

      margin: auto 0;

      padding: 10vh 0;
    }


    /* =========================
       GLITCH TITLE
    ========================= */

    .glitch-wrapper {
      display: inline-block;

      margin-bottom: 34px;
    }

    .glitch-text {
      font-family: 'Space Grotesk', sans-serif;

      font-size: clamp(64px, 11vw, 150px);

      font-weight: 600;

      line-height: 0.9;

      letter-spacing: -0.065em;

      color: #E94140;

      display: inline-block;

      cursor: default;
    }

    .glitch-line {
      position: relative;

      display: block;

      width: fit-content;
    }


    /* Ghost layers */

    .glitch-line::before,
    .glitch-line::after {
      content: attr(data-text);

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      opacity: 0;

      pointer-events: none;
    }


    /* Cyan */

    .glitch-line::before {
      color: #00FFFF;

      z-index: -1;
    }


    /* Magenta */

    .glitch-line::after {
      color: #FF00FF;

      z-index: -2;
    }


    /* =========================
       GLITCH HOVER
    ========================= */

    .glitch-line:hover::before {
      opacity: 0.8;

      animation:
        glitch-loop-1
        0.4s
        cubic-bezier(.25, .46, .45, .94)
        both infinite;
    }

    .glitch-line:hover::after {
      opacity: 0.8;

      animation:
        glitch-loop-2
        0.4s
        cubic-bezier(.25, .46, .45, .94)
        both infinite;
    }

    .glitch-line:hover {
      animation:
        glitch-main
        0.4s
        both infinite;
    }


    /* =========================
       GLITCH ANIMATION 1
    ========================= */

    @keyframes glitch-loop-1 {

      0% {
        transform: translate(0);
        clip-path: inset(0 0 0 0);
      }

      20% {
        transform: translate(-3px, 1px);
        clip-path: inset(10% 0 40% 0);
      }

      40% {
        transform: translate(3px, -1px);
        clip-path: inset(40% 0 10% 0);
      }

      60% {
        transform: translate(-3px, 0);
        clip-path: inset(80% 0 5% 0);
      }

      80% {
        transform: translate(2px, 1px);
        clip-path: inset(20% 0 60% 0);
      }

      100% {
        transform: translate(0);
        clip-path: inset(0 0 0 0);
      }

    }


    /* =========================
       GLITCH ANIMATION 2
    ========================= */

    @keyframes glitch-loop-2 {

      0% {
        transform: translate(0);
        clip-path: inset(0 0 0 0);
      }

      20% {
        transform: translate(3px, -1px);
        clip-path: inset(30% 0 10% 0);
      }

      40% {
        transform: translate(-3px, 1px);
        clip-path: inset(10% 0 50% 0);
      }

      60% {
        transform: translate(3px, 0);
        clip-path: inset(50% 0 20% 0);
      }

      80% {
        transform: translate(-2px, -1px);
        clip-path: inset(0% 0 80% 0);
      }

      100% {
        transform: translate(0);
        clip-path: inset(0 0 0 0);
      }

    }


    /* =========================
       MAIN GLITCH MOVEMENT
    ========================= */

    @keyframes glitch-main {

      0% {
        transform: translate(0);
      }

      20% {
        transform: translate(1px, -0.5px);
      }

      40% {
        transform: translate(-1px, 0.5px);
      }

      60% {
        transform: translate(1px, 0.5px);
      }

      80% {
        transform: translate(-1px, -0.5px);
      }

      100% {
        transform: translate(0);
      }

    }


    /* =========================
       REDIRECT MESSAGE
    ========================= */

    .redirect-message {
      font-family: 'Courier New', monospace;

      font-size: 14px;

      color: #F2F2F2;

      margin-bottom: 22px;
    }


    /* =========================
       LOADING BAR
    ========================= */

    .loading {
      width: min(420px, 100%);

      height: 2px;

      background: #3A3A3A;

      overflow: hidden;
    }

    .loading-bar {
      width: 0%;
      height: 100%;

      background: #E94140;

      animation: loading 3s linear forwards;
    }

    @keyframes loading {

      0% {
        width: 0%;
      }

      100% {
        width: 100%;
      }

    }


    /* =========================
       MANUAL LINK
    ========================= */

    .manual-link {
      display: block;

      margin-top: 18px;

      font-family: 'Courier New', monospace;

      font-size: 11px;

      color: #666666;

      text-decoration: none;

      transition: color 0.2s ease;
    }

    .manual-link:hover {
      color: #F2F2F2;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      display: flex;

      justify-content: space-between;

      align-items: flex-end;

      gap: 20px;

      font-family: 'Courier New', monospace;

      font-size: 11px;

      color: #666666;

      text-transform: uppercase;

      letter-spacing: 0.05em;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .page {
        padding: 22px;
      }

      .content {
        padding: 8vh 0;
      }

      .glitch-text {
        font-size: clamp(52px, 17vw, 90px);
      }

      .redirect-message {
        font-size: 13px;
      }

      footer {
        flex-direction: column;

        align-items: flex-start;
      }

    }

  </style>
</head>


<body>

  <main class="page">


    <!-- STATUS -->

    <div class="status">
      <span>●</span> status / redirecting
    </div>


    <!-- MAIN -->

    <section class="content">


      <!-- GLITCH TITLE -->

      <div class="glitch-wrapper">

        <div class="glitch-text">

          <span
            class="glitch-line"
            data-text="é por aqui."
          >
            é por aqui.
          </span>

        </div>

      </div>


      <!-- MESSAGE -->

      <p class="redirect-message">
        taking you to my portfolio...
      </p>


      <!-- LOADING -->

      <div class="loading">

        <div class="loading-bar"></div>

      </div>


      <!-- FALLBACK -->

      <a
        class="manual-link"
        href="https://readymag.website/u542318838/5701574/"
      >
        click here if nothing happens →
      </a>


    </section>


    <!-- FOOTER -->

    <footer>

      <span>
        sabrina damacena / art director
      </span>

      <span>
        2026
      </span>

    </footer>


  </main>

</body>
</html>
